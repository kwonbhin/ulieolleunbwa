<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>언제 만나? 약속 날짜 정하기</title>
<meta property="og:title" content="언제 만나? 약속 날짜 정하기">
<meta property="og:description" content="이름을 입력하고 되는 날짜를 체크해 주세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFAF4; --ink:#2A3F8F; --ink-soft:#5C6CA8; --grid:#AEB6E0;
  --star:#F3C4E4; --muted:#8A90AE; --fill-text:#FCFAF4; --surface:#F1EFF8; --danger:#B23A5B;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --display:Anton,Impact,"Arial Narrow",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141B38; --ink:#DCE2FF; --ink-soft:#A7B2E6; --grid:#3B4679;
    --star:#E79BCF; --muted:#7D86B5; --fill-text:#141B38; --surface:#1B2347; --danger:#F08AA6;
  }
}
:root[data-theme="dark"]{
  --paper:#141B38; --ink:#DCE2FF; --ink-soft:#A7B2E6; --grid:#3B4679;
  --star:#E79BCF; --muted:#7D86B5; --fill-text:#141B38; --surface:#1B2347; --danger:#F08AA6;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font-family:var(--font)}
.wrap{max-width:1120px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 56px}

/* ---------- header: wall-calendar look ---------- */
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.month-big{font-family:var(--display);font-weight:400;font-size:clamp(84px,15vw,180px);line-height:.86;margin:0;text-transform:uppercase}
.year{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--display);font-size:clamp(36px,5.5vw,60px);line-height:.92;position:relative;padding-top:34px}
.year svg{position:absolute;top:0;right:4px;width:30px;height:30px;fill:var(--star)}

.title-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:20px 0 6px}
.title-input{font-size:26px;font-weight:700;line-height:1.3;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed transparent;padding:2px 0;min-width:0;flex:1 1 280px;max-width:560px}
.title-input:hover{border-bottom-color:var(--grid)}
.title-input:focus{outline:none;border-bottom-color:var(--ink)}
.hint{color:var(--muted);font-size:14px}
.sharebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 20px}

/* ---------- join ---------- */
.join{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border:1.5px solid var(--ink);border-radius:14px;margin-bottom:22px}
.join label{font-weight:700}
.join input{flex:1 1 200px;min-width:0;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--grid);border-radius:10px;padding:10px 12px}
.join input:focus{outline:none;border-color:var(--ink)}
.me{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:1}
.me strong{font-size:18px}
.me .spacer{flex:1}
.btn{font-size:15px;font-weight:700;line-height:1;border-radius:10px;padding:12px 18px;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:8px 12px;font-size:14px}
.btn:focus-visible,.cell:focus-visible,.nav:focus-visible,.best li:focus-visible,.title-input:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{margin:0;font-size:18px}
.nav{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--grid);background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.nav:disabled{opacity:.35;cursor:default}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{text-align:center;padding:6px 0 8px}
.dow .en{font-family:var(--display);font-size:clamp(16px,2.2vw,24px)}
.dow .ko{display:none;font-weight:700;font-size:14px}
.grid{border-top:1.5px solid var(--grid);border-left:1.5px solid var(--grid)}
.cell{position:relative;aspect-ratio:1/1;min-height:56px;border:0;border-right:1.5px solid var(--grid);border-bottom:1.5px solid var(--grid);background:var(--paper);color:var(--ink);padding:0;cursor:pointer;display:block;transition:background-color .15s;-webkit-tap-highlight-color:transparent}
.cell .n{position:absolute;top:6px;right:9px;font-weight:700;font-size:16px}
.cell .cnt{position:absolute;left:8px;bottom:6px;font-size:13px;font-weight:500}
.cell.empty{cursor:default;background:transparent}
.cell.past{cursor:not-allowed;color:var(--muted)}
.cell.past .n{opacity:.5}
.cell.mine::after{content:"";position:absolute;inset:4px;border:2.5px solid var(--ink);border-radius:6px;pointer-events:none}
.cell.dark{color:var(--fill-text)}
.cell.dark.mine::after{border-color:var(--fill-text)}
.cell.sel{box-shadow:inset 0 0 0 3px var(--star)}
.cell .allstar{position:absolute;top:6px;left:7px;width:18px;height:18px;fill:var(--star)}
.cell.today .n{text-decoration:underline;text-underline-offset:3px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-soft);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block;border:1.5px solid var(--grid)}
.sw.mine{border:2.5px solid var(--ink)}
.legend svg{width:16px;height:16px;fill:var(--star)}

/* ---------- side panel ---------- */
aside{display:flex;flex-direction:column;gap:22px}
aside section{border-top:1.5px solid var(--ink);padding-top:12px}
aside h3{margin:0 0 10px;font-size:16px}
.best{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.best li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;background:var(--surface);cursor:pointer}
.best li .who{color:var(--ink-soft);font-size:13px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--grid);border-radius:999px;padding:4px 11px;font-size:14px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.off{color:var(--muted);text-decoration:line-through}
.empty-note{color:var(--muted);font-size:14px;margin:0}
.status{font-size:13px;color:var(--muted);min-height:1.2em;margin-top:8px}
.status.err{color:var(--danger)}
.banner{padding:10px 14px;border-radius:10px;background:var(--surface);font-size:14px;margin:16px 0}

/* ---------- tablet ---------- */
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:26px}
}

/* ---------- phone ---------- */
@media (max-width:600px){
  .wrap{padding:14px 14px 90px}
  .month-big{font-size:clamp(64px,22vw,96px)}
  .year{font-size:28px;padding-top:22px}
  .year svg{width:20px;height:20px;right:2px}
  .title-row{margin:12px 0 4px}
  .title-row .hint{display:none}
  .title-input{font-size:21px;flex-basis:100%}
  .sharebar{margin-bottom:14px}
  .sharebar .hint{font-size:13px}

  .join{flex-direction:column;align-items:stretch;padding:12px;gap:8px;border-radius:12px;margin-bottom:16px}
  .join .btn{width:100%;padding:13px}
  .me{flex-direction:column;align-items:stretch;gap:8px}
  .me .spacer{display:none}
  .me .row{display:flex;gap:8px}
  .me .row .btn{flex:1}

  .cal-head h2{font-size:17px}
  .nav{width:38px;height:38px}
  .dow .en{display:none}
  .dow .ko{display:inline}
  .dow div{padding:4px 0 6px}
  .cell{aspect-ratio:auto;height:58px;min-height:0}
  .cell .n{top:4px;right:6px;font-size:14px}
  .cell .cnt{left:6px;bottom:4px;font-size:12px;font-weight:700}
  .cell .cnt .u{display:none}
  .cell .allstar{top:5px;left:5px;width:13px;height:13px}
  .cell.mine::after{inset:3px;border-width:2px;border-radius:5px}
  .legend{gap:8px 14px;font-size:12px}

  aside{gap:18px}
  #daySection{order:1}
  #bestSection{order:2}
  #peopleSection{order:3}

  /* 체크 상태를 화면 아래에 고정 */
  .status{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin:0;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:14px;text-align:center;min-height:0;z-index:5}
  .status:empty{display:none}
  .status.err{background:var(--danger);color:#fff}
}
/* ---------- save / edit ---------- */
.me .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:4px;vertical-align:2px;border:1.5px solid var(--ink)}
.badge.saved{background:var(--ink);color:var(--paper)}
.badge.editing{background:var(--star);color:#2A3F8F;border-color:var(--star)}
.btn:disabled{opacity:.45;cursor:default}
.grid.locked .cell:not(.past):not(.empty){cursor:default}
.savebar{display:none}
@media (max-width:600px){
  .savebar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:14px;background:var(--paper);border:1.5px solid var(--ink);box-shadow:0 6px 20px rgba(20,27,56,.18)}
  .savebar span{flex:1;font-weight:700;font-size:15px}
  .savebar .btn{padding:12px 18px}
  body.has-bar .status{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.cell{transition:none}.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="month-big" id="bigMonth">SEPT</h1>
    <div class="year" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 1l2.2 5.3L19.8 4l-2.3 5.6L23 12l-5.5 2.4 2.3 5.6-5.6-2.3L12 23l-2.2-5.3L4.2 20l2.3-5.6L1 12l5.5-2.4L4.2 4l5.6 2.3z"/></svg>
      <span id="y1">20</span><span id="y2">26</span>
    </div>
  </header>

  <div class="banner" id="configErr" hidden></div>

  <div class="title-row">
    <input class="title-input" id="title" maxlength="40" value="우리 언제 만나?" aria-label="약속 이름">
    <span class="hint">약속 이름은 눌러서 바꿀 수 있어요</span>
  </div>
  <div class="sharebar">
    <button class="btn ghost small" id="copyBtn">링크 복사</button>
    <span class="hint" id="copyHint">카톡으로 보내면 같은 달력에 모여요</span>
  </div>

  <div class="join" id="joinBox">
    <div id="joinForm" style="display:contents">
      <label for="name">내 이름</label>
      <input id="name" maxlength="20" placeholder="이름을 입력하세요" autocomplete="nickname" enterkeyhint="go">
      <button class="btn" id="joinBtn">날짜 고르기</button>
    </div>
    <div class="me" id="meBox" hidden>
      <span><strong id="meName"></strong> 님 <span class="badge" id="meState"></span><br><span class="hint" id="meCount"></span></span>
      <span class="spacer"></span>
      <div class="row" id="editActions">
        <button class="btn" id="saveBtn">저장하기</button>
        <button class="btn ghost small" id="cancelBtn">취소</button>
      </div>
      <div class="row" id="viewActions">
        <button class="btn" id="editBtn">수정하기</button>
        <button class="btn ghost small" id="switchBtn">다른 이름으로</button>
        <button class="btn ghost small" id="leaveBtn">내 응답 삭제</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <main>
      <div class="cal-head">
        <button class="nav" id="prev" aria-label="이전 달">‹</button>
        <h2 id="monthLabel"></h2>
        <button class="nav" id="next" aria-label="다음 달">›</button>
      </div>
      <div class="dow" aria-hidden="true">
        <div><span class="en">SUN</span><span class="ko">일</span></div>
        <div><span class="en">MON</span><span class="ko">월</span></div>
        <div><span class="en">TUE</span><span class="ko">화</span></div>
        <div><span class="en">WED</span><span class="ko">수</span></div>
        <div><span class="en">THU</span><span class="ko">목</span></div>
        <div><span class="en">FRI</span><span class="ko">금</span></div>
        <div><span class="en">SAT</span><span class="ko">토</span></div>
      </div>
      <div class="grid" id="grid" role="grid"></div>
      <div class="legend">
        <span><i class="sw" style="background:color-mix(in srgb,var(--ink) 25%,var(--paper))"></i>가능한 사람 적음</span>
        <span><i class="sw" style="background:var(--ink)"></i>많음</span>
        <span><i class="sw mine"></i>내가 고른 날</span>
        <span><svg viewBox="0 0 24 24"><path d="M12 1l2.2 5.3L19.8 4l-2.3 5.6L23 12l-5.5 2.4 2.3 5.6-5.6-2.3L12 23l-2.2-5.3L4.2 20l2.3-5.6L1 12l5.5-2.4L4.2 4l5.6 2.3z"/></svg>모두 가능</span>
      </div>
      <div class="status" id="status" role="status"></div>
    </main>

    <aside>
      <section id="bestSection">
        <h3>가장 많이 모이는 날</h3>
        <ul class="best" id="best"></ul>
      </section>
      <section id="daySection">
        <h3 id="dayTitle">날짜를 누르면 누가 되는지 보여요</h3>
        <div class="chips" id="dayChips"></div>
      </section>
      <section id="peopleSection">
        <h3 id="peopleTitle">참여자</h3>
        <div class="chips" id="people"></div>
      </section>
    </aside>
  </div>
</div>

<div class="savebar" id="saveBar" hidden>
  <span id="saveBarText"></span>
  <button class="btn" id="saveBarBtn">저장하기</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// 오류가 나면 화면에 바로 보여주기
window.addEventListener('error', function (e) {
  var b = document.getElementById('configErr');
  if (b) { b.hidden = false; b.textContent = '사이트 오류: ' + (e.message || e) + ' (이 문구를 캡처해서 알려주세요)'; }
});
</script>
<script src="config.js?v=20260930c"></script>
<script>
(function () {
  const STAR = '<svg class="allstar" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.2 5.3L19.8 4l-2.3 5.6L23 12l-5.5 2.4 2.3 5.6-5.6-2.3L12 23l-2.2-5.3L4.2 20l2.3-5.6L1 12l5.5-2.4L4.2 4l5.6 2.3z"/></svg>';
  const MON = ['JAN','FEB','MAR','APR','MAY','JUNE','JULY','AUG','SEPT','OCT','NOV','DEC'];
  const DOW_KO = ['일','월','화','수','목','금','토'];
  const DEFAULT_EVENT = 'mainmeetup';   // 주소에 ?e= 가 없으면 이 약속을 사용
  const $ = id => document.getElementById(id);

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayKey = key(today);
  let view = new Date(today.getFullYear(), today.getMonth(), 1);
  const minView = new Date(view);

  let people = {};        // name_key -> {name, dates}
  let me = null;          // {key, name, saved:Set, draft:Set, editing, isNew}
  let selected = null;
  let saving = false, statusTimer = null;

  function key(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function prettyDate(k) { const [y, m, d] = k.split('-').map(Number); const dt = new Date(y, m - 1, d); return m + '월 ' + d + '일 (' + DOW_KO[dt.getDay()] + ')'; }
  function nameKey(n) { return n.trim().toLowerCase(); }
  function setStatus(msg, err, autoHide) {
    const s = $('status'); clearTimeout(statusTimer);
    s.textContent = msg || ''; s.classList.toggle('err', !!err);
    if (autoHide) statusTimer = setTimeout(() => { s.textContent = ''; }, 2200);
  }

  // ---------- Supabase 연결 ----------
  const cfg = window.MEETUP_CONFIG || {};
  const badCfg = !cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes('YOUR-') || !cfg.SUPABASE_ANON_KEY || cfg.SUPABASE_ANON_KEY.includes('YOUR-');
  let sb = null;
  if (!window.supabase) showError('Supabase 라이브러리를 불러오지 못했어요. index.html의 supabase-js 주소를 확인하세요.');
  else if (badCfg) showError('config.js에 Supabase 주소와 anon key를 넣어야 사이트가 작동해요.');
  else sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  function showError(msg) { const b = $('configErr'); b.textContent = msg; b.hidden = false; }

  const params = new URLSearchParams(location.search);
  let EVENT = (params.get('e') || '').toLowerCase();
  if (!/^[a-z0-9]{10}$/.test(EVENT)) EVENT = DEFAULT_EVENT;

  try { const saved = localStorage.getItem('meetup-name'); if (saved) $('name').value = saved; } catch (e) {}

  function allPeople() {
    const map = Object.assign({}, people);
    if (me && (me.editing || !me.isNew)) map[me.key] = { name: me.name, dates: Array.from(shown()) };
    return map;
  }
  function shown() { return me ? (me.editing ? me.draft : me.saved) : new Set(); }
  function changed() {
    if (!me || !me.editing) return false;
    if (me.draft.size !== me.saved.size) return true;
    for (const d of me.draft) if (!me.saved.has(d)) return true;
    return false;
  }
  function tally() {
    const map = allPeople(); const counts = {};
    for (const k in map) for (const d of (map[k].dates || [])) (counts[d] = counts[d] || []).push(map[k].name);
    return { map, counts, total: Object.keys(map).length };
  }

  function render() {
    const { map, counts, total } = tally();
    $('bigMonth').textContent = MON[view.getMonth()];
    const ys = String(view.getFullYear()); $('y1').textContent = ys.slice(0, 2); $('y2').textContent = ys.slice(2);
    $('monthLabel').textContent = view.getFullYear() + '년 ' + (view.getMonth() + 1) + '월';
    $('prev').disabled = view <= minView;

    const grid = $('grid'); grid.innerHTML = '';
    const first = view.getDay();
    const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    for (let i = 0; i < first; i++) { const e = document.createElement('div'); e.className = 'cell empty'; grid.appendChild(e); }
    for (let d = 1; d <= days; d++) {
      const dt = new Date(view.getFullYear(), view.getMonth(), d); const k = key(dt);
      const b = document.createElement('button'); b.className = 'cell'; b.dataset.k = k;
      const past = dt < today;
      const names = counts[k] || []; const n = names.length;
      if (past) { b.classList.add('past'); b.disabled = true; }
      if (k === todayKey) b.classList.add('today');
      if (!past && n && total) {
        const pct = Math.round(18 + 82 * (n / total));
        b.style.background = 'color-mix(in srgb, var(--ink) ' + pct + '%, var(--paper))';
        if (pct >= 58) b.classList.add('dark');
      }
      const mine = me && shown().has(k);
      if (mine) b.classList.add('mine');
      if (selected === k) b.classList.add('sel');
      let html = '<span class="n">' + d + '</span>';
      if (!past && n) html += '<span class="cnt">' + n + '<span class="u">명</span></span>';
      if (!past && total >= 2 && n === total) html += STAR;
      b.innerHTML = html;
      b.setAttribute('aria-label', prettyDate(k) + ', ' + n + '명 가능' + (mine ? ', 내가 선택함' : ''));
      b.setAttribute('aria-pressed', mine ? 'true' : 'false');
      grid.appendChild(b);
    }

    const best = $('best'); best.innerHTML = '';
    const ranked = Object.entries(counts).filter(([k]) => k >= todayKey)
      .sort((a, b) => b[1].length - a[1].length || (a[0] < b[0] ? -1 : 1)).slice(0, 5);
    if (!ranked.length) best.innerHTML = '<p class="empty-note">아직 체크된 날짜가 없어요. 이름을 입력하고 첫 번째로 골라보세요.</p>';
    for (const [k, names] of ranked) {
      const li = document.createElement('li'); li.tabIndex = 0;
      li.innerHTML = '<b></b><span class="who"></span>';
      li.querySelector('b').textContent = prettyDate(k);
      li.querySelector('.who').textContent = names.length + '/' + total + '명' + (names.length === total && total > 1 ? ' · 모두 가능' : '');
      const go = () => { const [y, m] = k.split('-').map(Number); view = new Date(y, m - 1, 1); selected = k; render(); };
      li.onclick = go; li.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
      best.appendChild(li);
    }

    const chips = $('dayChips'); chips.innerHTML = '';
    if (selected) {
      const yes = counts[selected] || [];
      $('dayTitle').textContent = prettyDate(selected) + ' · ' + yes.length + '명 가능';
      const allNames = Object.values(map).map(p => p.name).sort((a, b) => a.localeCompare(b, 'ko'));
      if (!allNames.length) chips.innerHTML = '<p class="empty-note">아직 참여자가 없어요.</p>';
      for (const nm of allNames) { const c = document.createElement('span'); c.className = 'chip ' + (yes.includes(nm) ? 'on' : 'off'); c.textContent = nm; chips.appendChild(c); }
    } else {
      $('dayTitle').textContent = '날짜를 누르면 누가 되는지 보여요';
    }

    const pl = $('people'); pl.innerHTML = '';
    const list = Object.values(map).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    $('peopleTitle').textContent = '참여자 ' + list.length + '명';
    if (!list.length) pl.innerHTML = '<p class="empty-note">이름을 입력하면 여기에 표시돼요.</p>';
    for (const p of list) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = p.name + ' ' + (p.dates || []).length; pl.appendChild(c); }

    $('grid').classList.toggle('locked', !!me && !me.editing);
    renderMe();
  }

  function renderMe() {
    const bar = $('saveBar');
    if (!me) { bar.hidden = true; document.body.classList.remove('has-bar'); return; }
    const n = shown().size, dirty = changed();
    const st = $('meState');
    if (me.editing) {
      st.textContent = me.isNew ? '새로 작성 중' : (dirty ? '수정 중 · 저장 안 됨' : '수정 중');
      st.className = 'badge editing';
      $('meCount').textContent = n + '일 선택됨 · 되는 날짜를 누르고 저장하기를 눌러주세요';
    } else {
      st.textContent = '저장됨'; st.className = 'badge saved';
      $('meCount').textContent = n + '일 선택됨 · 바꾸려면 수정하기를 눌러주세요';
    }
    $('editActions').hidden = !me.editing;
    $('viewActions').hidden = me.editing;
    $('saveBtn').disabled = saving || (!dirty && !me.isNew);
    bar.hidden = !me.editing;
    document.body.classList.toggle('has-bar', !bar.hidden);
    $('saveBarText').textContent = n + '일 선택' + (dirty ? ' · 저장 안 됨' : '');
    $('saveBarBtn').disabled = $('saveBtn').disabled;
    $('saveBarBtn').textContent = saving ? '저장 중…' : '저장하기';
    $('saveBtn').textContent = saving ? '저장 중…' : '저장하기';
  }

  // ---------- 데이터 ----------
  async function loadEvent() {
    const { data, error } = await sb.from('events').select('title').eq('id', EVENT).maybeSingle();
    if (error) { setStatus('약속 정보를 불러오지 못했어요: ' + error.message, true); return false; }
    if (!data) {
      if (EVENT !== DEFAULT_EVENT) { location.replace(location.pathname); return false; }
      const ins = await sb.from('events').insert({ id: DEFAULT_EVENT, title: '우리 언제 만나?' });
      if (ins.error && ins.error.code !== '23505') { setStatus('약속을 준비하지 못했어요: ' + ins.error.message, true); return false; }
      return true;
    }
    if (document.activeElement !== $('title')) $('title').value = data.title;
    document.title = data.title + ' · 약속 날짜 정하기';
    return true;
  }
  async function loadResponses() {
    const { data, error } = await sb.from('responses').select('name,name_key,dates').eq('event_id', EVENT);
    if (error) { setStatus('응답을 불러오지 못했어요: ' + error.message, true); return; }
    const next = {};
    for (const r of data) next[r.name_key] = { name: r.name, dates: r.dates || [] };
    people = next;
    if (me && next[me.key]) {
      me.saved = new Set(next[me.key].dates); me.isNew = false;
      if (!me.editing) me.draft = new Set(me.saved);
    }
    render();
  }

  // ---------- 조작 ----------
  $('grid').addEventListener('click', e => {
    const b = e.target.closest('.cell'); if (!b || !b.dataset.k || b.disabled) return;
    const k = b.dataset.k; selected = k;
    if (me && me.editing) { if (me.draft.has(k)) me.draft.delete(k); else me.draft.add(k); }
    else if (me) setStatus('날짜를 바꾸려면 수정하기를 눌러주세요', false, true);
    else if (window.matchMedia('(max-width:600px)').matches) setStatus('이름을 먼저 입력하면 날짜를 체크할 수 있어요', false, true);
    render();
  });
  $('prev').onclick = () => { if (view > minView) { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); } };
  $('next').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };

  function join() {
    const name = $('name').value.trim();
    if (!name) { const box = $('joinBox'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); $('name').focus(); return; }
    const k = nameKey(name); const existing = people[k];
    const saved = new Set(existing ? existing.dates : []);
    me = { key: k, name: existing ? existing.name : name, saved, draft: new Set(saved), editing: !existing, isNew: !existing };
    try { localStorage.setItem('meetup-name', name); } catch (e) {}
    $('name').blur();
    $('joinForm').style.display = 'none'; $('meBox').hidden = false; $('meName').textContent = me.name;
    setStatus(existing ? '저장된 응답을 불러왔어요. 바꾸려면 수정하기를 눌러주세요' : '되는 날짜를 누르고 저장하기를 눌러주세요', false, true);
    render();
  }
  $('joinBtn').onclick = join;
  $('name').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
  $('switchBtn').onclick = () => {
    me = null; $('meBox').hidden = true; $('joinForm').style.display = 'contents'; $('name').value = ''; $('name').focus(); setStatus(''); render();
  };
  $('leaveBtn').onclick = async () => {
    if (!me || !confirm(me.name + ' 님의 응답을 모두 삭제할까요?')) return;
    const k = me.key; delete people[k]; me = null;
    $('meBox').hidden = true; $('joinForm').style.display = 'contents';
    render();
    if (!sb) return;
    const { error } = await sb.from('responses').delete().eq('event_id', EVENT).eq('name_key', k);
    setStatus(error ? '삭제하지 못했어요: ' + error.message : '응답을 삭제했어요', !!error, !error);
  };

  async function save() {
    if (!me || !me.editing || saving || !sb) return;
    if (!changed() && !me.isNew) return;
    saving = true; renderMe();
    const dates = Array.from(me.draft).sort();
    const row = { event_id: EVENT, name: me.name, name_key: me.key, dates, updated_at: new Date().toISOString() };
    const { error } = await sb.from('responses').upsert(row, { onConflict: 'event_id,name_key' });
    saving = false;
    if (error) { setStatus('저장하지 못했어요: ' + error.message, true); renderMe(); return; }
    me.saved = new Set(dates); me.draft = new Set(dates); me.editing = false; me.isNew = false;
    people[me.key] = { name: me.name, dates };
    setStatus(dates.length + '일 저장했어요. 다른 사람에게도 바로 보여요', false, true);
    render();
  }
  function startEdit() { if (!me) return; me.draft = new Set(me.saved); me.editing = true; render(); }
  function cancelEdit() {
    if (!me) return;
    if (changed() && !confirm('저장하지 않은 변경을 버릴까요?')) return;
    if (me.isNew) { me = null; $('meBox').hidden = true; $('joinForm').style.display = 'contents'; setStatus(''); render(); return; }
    me.draft = new Set(me.saved); me.editing = false; render();
  }
  $('saveBtn').onclick = save;
  $('saveBarBtn').onclick = save;
  $('editBtn').onclick = startEdit;
  $('cancelBtn').onclick = cancelEdit;
  window.addEventListener('beforeunload', e => { if (changed()) { e.preventDefault(); e.returnValue = ''; } });

  let titleTimer = null;
  $('title').addEventListener('input', () => {
    clearTimeout(titleTimer);
    titleTimer = setTimeout(async () => {
      if (!sb) return;
      const title = $('title').value.trim() || '우리 언제 만나?';
      await sb.from('events').update({ title }).eq('id', EVENT);
      document.title = title + ' · 약속 날짜 정하기';
    }, 800);
  });

  $('copyBtn').onclick = async () => {
    const url = location.origin + location.pathname + (EVENT === DEFAULT_EVENT ? '' : '?e=' + EVENT);
    try { await navigator.clipboard.writeText(url); $('copyHint').textContent = '복사했어요. 카톡에 붙여넣으세요.'; }
    catch (e) { prompt('아래 링크를 복사하세요', url); }
  };

  // ---------- 시작 ----------
  render();
  if (!sb) return;
  (async () => {
    if (!(await loadEvent())) return;
    await loadResponses();
    sb.channel('event-' + EVENT)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'responses', filter: 'event_id=eq.' + EVENT }, () => loadResponses())
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'events', filter: 'id=eq.' + EVENT }, () => loadEvent())
      .subscribe();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadResponses(); });
  })();
})();
</script>
</body>
</html>
